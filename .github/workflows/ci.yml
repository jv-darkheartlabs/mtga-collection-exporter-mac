name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-mac.txt

      - name: Syntax and import check
        run: |
          python -m compileall mtg.py mtga_memory.py
          python -c "import mtg; import mtga_memory"
