name: Release macOS binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone binary
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mac.txt pyinstaller
          pyinstaller \
            --onefile \
            --name mtga-export \
            --clean \
            --collect-all pymem \
            --copy-metadata pymem-osx \
            mtg.py
          chmod +x dist/mtga-export
          cd dist && shasum -a 256 mtga-export > mtga-export.sha256

      - name: Create release archive
        run: |
          mkdir -p release
          cp dist/mtga-export release/
          cp dist/mtga-export.sha256 release/
          cp README.md LICENSE release/
          cd release && zip -r ../mtga-collection-exporter-mac-macos-arm64.zip .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mtga-collection-exporter-mac-macos-arm64.zip
            dist/mtga-export
            dist/mtga-export.sha256
          generate_release_notes: true
